<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Trace promo (20s, 1080x1920)</title>
<style>
  @font-face { font-family: Geist; src: url("fonts/geist-latin-wght-normal.woff2"); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url("fonts/geist-mono-latin-wght-normal.woff2"); font-weight: 100 900; }
  html,body{margin:0;background:#111;height:100%} body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;aspect-ratio:9/16;display:block}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
// Trace promo. One page, deterministic: window.renderAt(t) draws frame t on canvas #c.
// Layers: 2D background and glass UI, a three.js layer (the app's own DNA and body hologram) clipped inside the card,
// then captions. Every shot grows out of the one before; there are no cross dissolves.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920, END = 20;
const q = new URLSearchParams(location.search), S = parseFloat(q.get('scale') || '1');
const cv = document.getElementById('c'); cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');

// ---------- every beat time lives here ----------
const TL = {
  hook: [0.35, 1.7],                 // caption 1 in, out
  heroMove: [2.0, 2.6], squash: [2.35, 2.62], grow: [2.55, 3.5],
  cap2: [3.7, 5.55], cap3: [6.55, 8.7], cap4: [9.35, 11.75], cap5: [12.55, 14.3], cap6: [15.4, 17.05],
  spinEase: [5.4, 7.0], untilt: [5.7, 7.3], straighten: [5.9, 7.4], rungs: [6.3, 7.7], reveal: [6.6, 8.2], rungFade: [7.3, 7.95],
  tap: [8.4, 9.3], dolly: [9.0, 11.5], panelIn: [10.1, 10.8], type: [10.9, 11.9],
  iris: [12.0, 12.95], ballIn: [12.5, 13.2], sev: [13.1, 14.4],
  toList: [14.5, 15.4], rows: [14.9, 15.7], search: [15.8, 16.5], filter: [16.6, 17.1],
  toIcon: [17.2, 18.35], icon: [17.9, 18.6], wordmark: [18.4, 18.9], url: [18.7, 19.5], small: [19.2, 19.7],
};

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = k => 1 - Math.pow(1 - clamp(k), 3), outQuart = k => 1 - Math.pow(1 - clamp(k), 4), outExpo = k => (k = clamp(k)) >= 1 ? 1 : 1 - Math.pow(2, -10 * k);

// monotone cubic through keys [[t, v], ...]: one continuous curve with no kinks and no overshoot (so a move never reverses)
function curve(keys) {

  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;

}
const INK = '#263238', MIST = '#eceff1', GLASS = '#f4f7fb', BLUE = '#1565c0', INDIGO = '#9fa8da', SQ = '#c5cae9', ORANGE = '#f57c00';

// ---------- layout (logical 1080x1920) ----------
const CARD = { x: 90, y: 230, w: 900, h: 1300, r: 64 };
const PANEL_A = { x: 130, y: 1090, w: 820, h: 400, r: 48 };       // the note panel
const SEARCH = { x: 130, y: 290, w: 820, h: 92, r: 30 };          // the same panel becomes the search bar
const CAP_Y = 1700;                                              // caption baseline zone, same place every shot

// ---------- text ----------
function setFont(size, mono, weight = 400, track = -0.03) { ctx.font = `${weight} ${size}px ${mono ? 'GeistMono' : 'Geist'}, system-ui, sans-serif`; ctx.letterSpacing = `${track * size}px`; }

// word by word: each word fades up from blurred to sharp with a small rise, and leaves the same way
function words(lines, cx, cy, size, color, tIn, tOut, t, lh = 1.12, weight = 400) {
  if (t < tIn || t > tOut + 1.2) return;
  setFont(size, false, weight); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; let idx = 0;
  lines.forEach((line, li) => {
    const ws = line.split(' '), space = ctx.measureText(' ').width, widths = ws.map(w => ctx.measureText(w).width), total = widths.reduce((a, b) => a + b, 0) + space * (ws.length - 1);
    let x = cx - total / 2; const y = cy + (li - (lines.length - 1) / 2) * size * lh;
    ws.forEach((w, i) => {
      const a = outCubic(prog(t, tIn + idx * .09, tIn + idx * .09 + .6)), b = inCubic(prog(t, tOut + idx * .06, tOut + idx * .06 + .45)), vis = a * (1 - b);
      if (vis > .003) { ctx.globalAlpha = vis; ctx.fillStyle = color; withBlur((1 - a) * 16 + b * 12, () => ctx.fillText(w, x, y + (1 - a) * 26 - b * 20)); ctx.globalAlpha = 1; }
      x += widths[i] + space; idx++;
    });
  });
}
function label(txt, x, y, align, size, color, tIn, tOut, t, track = .14) {   // mono caps label, rolls up in and out
  if (t < tIn || t > tOut + .5) return; const a = outCubic(prog(t, tIn, tIn + .5)), b = inCubic(prog(t, tOut, tOut + .4));
  setFont(size, true, 400, track); ctx.textAlign = align; ctx.fillStyle = color; ctx.globalAlpha = a * (1 - b); ctx.fillText(txt, x, y + (1 - a) * 22 - b * 18); ctx.globalAlpha = 1;
}
const typed = (txt, p) => txt.slice(0, Math.floor(clamp(p) * (txt.length + .001)));

// ---------- background: the app's quiet square pattern ----------
function background(t) {
  ctx.fillStyle = MIST; ctx.fillRect(0, 0, W, H);
  const cell = 36, cols = Math.ceil(W / cell) + 2, rows = Math.ceil(H / cell) + 1, tick = Math.floor(t * 8), drift = (t * 7) % cell;
  const wipe = inOutCubic(prog(t, 17.0, 18.4)) * .6;   // quieter around the end card
  ctx.fillStyle = SQ;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const fy = r / rows, fx = c / cols, dens = Math.pow(Math.max(0, 1 - fy * 1.15), 2.2) * (.35 + .65 * fx) * .9 * (1 - wipe) + (t < 2.7 ? .035 * (1 - prog(t, 1.9, 2.7)) : 0);
    const h = hash(c, r, tick >> 2); if (h < dens) { const j = hash(c, r, 99); ctx.globalAlpha = .35 + .5 * hash(c, r, tick); ctx.fillRect(c * cell - drift + 4 + j * 2, r * cell + 4, 18, 18); }
  }
  ctx.globalAlpha = 1;
}

// ---------- glass ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); }
function glass(x, y, w, h, r, o = {}) {
  const fill = o.fill || GLASS;
  ctx.save(); ctx.shadowColor = 'rgba(38,50,56,' + (o.shadow ?? .16) + ')'; ctx.shadowBlur = (o.blur ?? 70) * S; ctx.shadowOffsetY = (o.dy ?? 30) * S; rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  if (o.edge === false) return; const ea = o.edgeA ?? 1; if (ea <= 0.01) return; ctx.save(); ctx.globalAlpha = ea; rr(x, y, w, h, r); ctx.clip();
  let g = ctx.createLinearGradient(x, 0, x + 34, 0); g.addColorStop(0, 'rgba(100,181,246,.55)'); g.addColorStop(1, 'rgba(100,181,246,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, 34, h);
  g = ctx.createLinearGradient(x + w, 0, x + w - 34, 0); g.addColorStop(0, 'rgba(255,138,101,.5)'); g.addColorStop(1, 'rgba(255,138,101,0)'); ctx.fillStyle = g; ctx.fillRect(x + w - 34, y, 34, h);
  g = ctx.createLinearGradient(0, y, 0, y + 16); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, w, 16);
  ctx.restore(); ctx.save(); ctx.globalAlpha = ea; rr(x + 1, y + 1, w - 2, h - 2, r); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}

// ---------- the card: hero square -> welcome card -> body panel -> list -> app icon ----------
const HERO = { x: 540, y: 1180, s: 28 };
function cardState(t) {
  // returns the card rect (or the hero square before it) and whether it is drawn as glass
  if (t < TL.grow[0]) {
    const mv = inOutCubic(prog(t, TL.heroMove[0], TL.heroMove[1])), sq = Math.sin(Math.PI * prog(t, TL.squash[0], TL.squash[1]));
    const x = lerp(HERO.x, 540, mv), y = lerp(HERO.y, 880, mv), s = HERO.s + 4 * mv, sx = s * (1 + .12 * sq), sy = s * (1 - .12 * sq);
    return { x: x - sx / 2, y: y - sy / 2, w: sx, h: sy, r: 4, kind: 'hero' };
  }
  const g = outQuart(prog(t, TL.grow[0], TL.grow[1])), g2 = inOutCubic(prog(t, TL.grow[0], TL.grow[1]));
  let r = { x: lerp(540 - 14, CARD.x, g), y: lerp(880 - 14, CARD.y, g), w: lerp(28, CARD.w, g), h: lerp(28, CARD.h, g), r: lerp(5, CARD.r, g), kind: g < 1 ? 'grow' : 'card' };
  const m = inOutCubic(prog(t, TL.toIcon[0], TL.toIcon[1]));
  if (m > 0) { const tile = { x: 540 - 190, y: 800 - 190, w: 380, h: 380, r: 86 }; r = { x: lerp(r.x, tile.x, m), y: lerp(r.y, tile.y, m), w: lerp(r.w, tile.w, m), h: lerp(r.h, tile.h, m), r: lerp(r.r, tile.r, m), kind: 'tile', m }; }
  return r;
}

// ---------- three.js: the app's own DNA and body ----------
const gl = document.createElement('canvas'); gl.width = W * S; gl.height = H * S;
const renderer = new THREE.WebGLRenderer({ canvas: gl, alpha: true, antialias: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W * S, H * S, false); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
camera.setViewOffset(W * S, H * S, 0, 80 * S, W * S, H * S);   // card centre sits 80px above frame centre
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; }
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 4, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0x90caf9, .5); fill.position.set(-4, -2, -3); scene.add(fill);

const HH = 4.2, RAD = .55, TURNS = 2.2, TEAL = new THREE.Color('#1e88e5'), AMBER = new THREE.Color('#ffa726');
const helixPt = (phase, t) => { const a = phase + t * TURNS * 2 * Math.PI; return new THREE.Vector3(RAD * Math.cos(a), (t - .5) * HH, RAD * Math.sin(a)); };
class Helix extends THREE.Curve { constructor(p) { super(); this.p = p; } getPoint(t, o = new THREE.Vector3()) { return o.copy(helixPt(this.p, t)); } }
const dna = new THREE.Group(), tilt = new THREE.Group(); tilt.add(dna); scene.add(tilt);
const strandMat = new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: .35, roughness: .22, clearcoat: 1, clearcoatRoughness: .15 });
const strands = [0, Math.PI].map(ph => {
  const curve = new Helix(ph), geo = new THREE.TubeGeometry(curve, 260, .085, 16, false), pos = geo.getAttribute('position'), col = new Float32Array(pos.count * 3), c = new THREE.Color();
  const base = Float32Array.from(pos.array), cen = [], per = 17;
  for (let i = 0; i <= 260; i++) cen.push(curve.getPointAt(i / 260));
  for (let v = 0; v < pos.count; v++) { c.copy(TEAL).lerp(AMBER, clamp((pos.getY(v) + HH / 2) / HH)); col.set([c.r, c.g, c.b], v * 3); }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mesh = new THREE.Mesh(geo, strandMat); dna.add(mesh); return { geo, base, cen, per };
});
const rungData = Array.from({ length: 22 }, (_, k) => { const t = .03 + (k / 21) * .94, a = helixPt(0, t), phi = Math.atan2(a.z, a.x); return { t, y: a.y, phi, col: TEAL.clone().lerp(AMBER, t) }; });
const rungMeshes = rungData.map(r => { const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 10), new THREE.MeshPhysicalMaterial({ color: r.col, metalness: .3, roughness: .25, clearcoat: 1, clearcoatRoughness: .2, transparent: true })); dna.add(m); return m; });

// body hologram (same shader as the app)
const VERT = `varying vec3 vW; varying vec3 vN; varying vec3 vV; varying float vHead;
void main(){ vHead = step(color.r, 0.002); vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; vN = normalize(normalMatrix * normal); vec4 mv = viewMatrix * wp; vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`;
const FRAG = `uniform float uTime; uniform vec3 uColor; uniform vec3 uTapColor; uniform vec3 uTap; uniform vec3 uTapT; uniform float uTapR; uniform float uReveal; uniform float uFade;
varying vec3 vW; varying vec3 vN; varying vec3 vV; varying float vHead;
float contour(float v, float freq, float width){ float x = v * freq; float d = abs(fract(x) - 0.5) * 2.0; float aa = fwidth(x) * 1.2; float line = 1.0 - smoothstep(width - aa, width + aa, d); return line * (1.0 - smoothstep(0.35, 0.9, fwidth(x) * 2.0)); }
void main(){
  float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0) * (1.0 - 0.35 * vHead);
  float lines = contour(vW.y, 58.0, 0.40) * (1.0 - 0.55 * vHead);
  float sweepY = mod(uTime * 0.7, 5.0) - 2.5; float sweep = exp(-pow((vW.y - sweepY) * 5.0, 2.0));
  float tap = 0.0;
  if (uTapR > 0.0) { float dist = distance(vW, uTap); float fall = 1.0 - smoothstep(uTapR * 0.65, uTapR, dist);
    float ring = 1.0 - smoothstep(0.0, 0.014, abs(vW.y - uTap.y)); float mer = 1.0 - smoothstep(0.0, 0.014, abs(dot(vW - uTap, uTapT)));
    float halo = (1.0 - smoothstep(0.0, 0.07, abs(vW.y - uTap.y))) * 0.18 + (1.0 - smoothstep(0.0, 0.07, abs(dot(vW - uTap, uTapT)))) * 0.18;
    tap = (ring + mer + halo) * fall; }
  vec3 col = mix(uColor, uTapColor, clamp(tap, 0.0, 1.0));
  float a = clamp(0.07 + f * 0.6 + lines * 0.8 + sweep * 0.25 + tap, 0.0, 1.0);
  a *= (1.0 - smoothstep(uReveal - 0.3, uReveal, abs(vW.x))) * uFade;

const bodyMat = new THREE.ShaderMaterial({ uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color('#1565c0') }, uTapColor: { value: new THREE.Color('#f57c00') }, uTap: { value: new THREE.Vector3() }, uTapT: { value: new THREE.Vector3(1, 0, 0) }, uTapR: { value: 0 }, uReveal: { value: 0 }, uFade: { value: 1 } }, vertexShader: VERT, fragmentShader: FRAG, vertexColors: true, transparent: true, depthWrite: false });
const body = new THREE.Group(); scene.add(body);
const rings = [[.8, .82, .7], [1.15, 1.16, .3]].map(([a, b, o]) => { const m = new THREE.Mesh(new THREE.RingGeometry(a, b, 96), new THREE.MeshBasicMaterial({ color: '#1565c0', transparent: true, opacity: 0 })); m.rotation.x = -Math.PI / 2; m.position.y = -2.13; body.add(m); m.userData.o = o; return m; });
let halfW = [], tapPoint = new THREE.Vector3(), tapNormal = new THREE.Vector3(0, 0, 1), chestY = .7;
async function loadBody() {
  const gltf = await new GLTFLoader().loadAsync('models/body-female.glb'); let geo;
  gltf.scene.traverse(o => { if (o.isMesh && !geo) geo = o.geometry; }); geo.computeBoundingBox(); const bb = geo.boundingBox, s = HH / (bb.max.y - bb.min.y);
  const mesh = new THREE.Mesh(geo, bodyMat); mesh.scale.setScalar(s); mesh.position.set(-(bb.max.x + bb.min.x) / 2 * s, -(bb.max.y + bb.min.y) / 2 * s, -(bb.max.z + bb.min.z) / 2 * s); body.add(mesh); mesh.updateMatrixWorld(true);
  const p = geo.getAttribute('position'), v = new THREE.Vector3(); halfW = rungData.map(() => .2);
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(mesh.matrixWorld); rungData.forEach((r, k) => { if (Math.abs(v.y - r.y) < .05) halfW[k] = Math.max(halfW[k], Math.abs(v.x)); }); }
  const rc = new THREE.Raycaster(new THREE.Vector3(0, chestY, 10), new THREE.Vector3(0, 0, -1)); const hit = rc.intersectObject(mesh)[0];
  if (hit) { tapPoint.copy(hit.point); tapNormal.set(0, 0, 1); } else tapPoint.set(0, chestY, .3);
  bodyMat.uniforms.uTap.value.copy(tapPoint);
}

// camera: ONE continuous move. Distance only ever shrinks, azimuth only ever drifts one way and arrives, elevation only rises.
const camD = curve([[0, 16.5], [3, 16], [5.8, 15.2], [9.0, 13.6], [11.4, 5.4], [14, 5.2], [20, 5.1]]);
const camAz = curve([[0, -.5], [3, -.45], [9.4, 0], [20, 0]]);
const camEl = curve([[0, -.12], [3, -.12], [9.4, .02], [20, .02]]);
const camTy = curve([[0, 0], [8.8, 0], [11.4, 0], [20, 0]]);
function updateCamera(t) {
  const ty = 0 + (t > 8.8 ? (tapPoint.y - .5) * inOutCubic(prog(t, 8.8, 11.4)) : 0), D = camD(t), az = camAz(t), el = camEl(t);
  const tgt = new THREE.Vector3(0, ty, 0); camera.position.set(tgt.x + D * Math.sin(az) * Math.cos(el), tgt.y + D * Math.sin(el), tgt.z + D * Math.cos(az) * Math.cos(el)); camera.lookAt(tgt); camera.updateMatrixWorld(true);
}
function updateDna(t) {
  const spinBase = .971 + .35 * Math.min(t, TL.spinEase[0]);
  // after spinEase[0] the spin eases to rest facing front (Hermite: start slope .35 rad/s, end slope 0)
  let rotY = spinBase; { const u = prog(t, ...TL.spinEase), d = TL.spinEase[1] - TL.spinEase[0], p0 = spinBase, p1 = Math.PI, m0 = .35 * d; if (t > TL.spinEase[0]) rotY = (2 * u ** 3 - 3 * u ** 2 + 1) * p0 + (u ** 3 - 2 * u ** 2 + u) * m0 + (-2 * u ** 3 + 3 * u ** 2) * p1; }

  const k = inOutCubic(prog(t, ...TL.straighten)), thin = lerp(1, .22, k) * (1 - outCubic(prog(t, 7.4, 8.1)));
  strands.forEach(st => { const pos = st.geo.getAttribute('position'), a = pos.array; for (let i = 0; i <= 260; i++) { const c = st.cen[i]; for (let j = 0; j < st.per; j++) { const v = (i * st.per + j) * 3; a[v] = c.x * (1 - k) + (st.base[v] - c.x) * thin; a[v + 1] = c.y + (st.base[v + 1] - c.y) * thin; a[v + 2] = c.z * (1 - k) + (st.base[v + 2] - c.z) * thin; } } pos.needsUpdate = true; });
  const k2 = inOutCubic(prog(t, ...TL.rungs)), fade = 1 - outCubic(prog(t, ...TL.rungFade)), blue = new THREE.Color('#1565c0');
  rungMeshes.forEach((m, i) => {
    const r = rungData[i], tgtAng = Math.round(r.phi / Math.PI) * Math.PI, ang = lerp(r.phi, tgtAng, k2), half = lerp(RAD, Math.max(.25, halfW[i] || .4), k2);
    const A = new THREE.Vector3(half * Math.cos(ang), r.y, half * Math.sin(ang)), B = new THREE.Vector3(-half * Math.cos(ang), r.y, -half * Math.sin(ang)), d = B.clone().sub(A);
    m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); const th = lerp(.034, .012, k2) * (fade > .01 ? 1 : 0); m.scale.set(th, d.length(), th);
    m.material.color.copy(r.col).lerp(blue, k2); m.material.opacity = fade; m.visible = fade > .01;
